name: Backend CI and Render Deploy

on:
  push:
    branches: [main]
    paths:
      - 'Clases/16_10NOV/MiPrimeraApiProductos/backend/**'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/README.md'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/.env.example'
      - 'render.yaml'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/DEPLOYMENT.md'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Clases/16_10NOV/MiPrimeraApiProductos/backend/**'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/README.md'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/.env.example'
      - 'render.yaml'
      - 'Clases/16_10NOV/MiPrimeraApiProductos/DEPLOYMENT.md'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mi_tienda_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d mi_tienda_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Clases/16_10NOV/MiPrimeraApiProductos/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mi_tienda_test?schema=public
      NODE_ENV: test
      FRONTEND_URL: http://localhost:2051
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.12
          cache: npm
          cache-dependency-path: Clases/16_10NOV/MiPrimeraApiProductos/backend/package-lock.json
      - run: npm ci
      - name: Report outdated dependencies
        run: npm outdated || true
      - run: npm run db:generate
      - run: npx prisma db push
      - run: npm run lint
      - name: Check JavaScript syntax
        shell: bash
        run: find src test -name '*.js' -print0 | xargs -0 -n1 node --check && node --check server.js
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Smoke test server startup
        shell: bash
        run: |
          node server.js > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5051/health; then
              exit 0
            fi
            sleep 1
          done
          cat server.log
          exit 1

  deploy:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deploy hook
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Explain skipped deployment
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "CI passed; configure the RENDER_DEPLOY_HOOK secret to enable deployment."