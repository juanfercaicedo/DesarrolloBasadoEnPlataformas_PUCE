services:
  - type: web
    name: mi-primera-api-productos
    runtime: node
    rootDir: Clases/16_10NOV/MiPrimeraApiProductos/backend
    branch: main
    plan: free
    buildCommand: npm ci && npm run db:generate
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_URL
        sync: false